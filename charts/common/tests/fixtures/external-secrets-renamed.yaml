service:
  port: 80

externalSecrets:
  clusterSecretStoreName: parameter-store
  secretsManagerClusterSecretStoreName: secrets-manager

env:
  PARAMETER:
    type: parameterStore
    name: parameter-renamed
    parameter_name: /updated/parameter
  SECRET:
    type: secretsManager
    name: secret
    secret_name: updated/secret
